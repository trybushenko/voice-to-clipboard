name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Install platform speech backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "$(uname -m)" = "arm64" ]; then
            python -m pip install '.[mac,hotkeys,desktop]'
            python -c "import mlx_whisper"
          else
            python -m pip install '.[whisper,hotkeys,desktop]'
            python -c "import faster_whisper"
          fi
      - run: python -m unittest discover -s tests -v
      - run: voice-to-clipboard --help
      - run: python tests/unit/test_gate.py

      - name: Windows real Unicode paste smoke
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: |
          python scripts/check_paste.py --auto --overlay --remote-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_paste.py --auto --change-focus --remote-host

      - name: Native desktop lifecycle smoke
        if: runner.os == 'Windows' || runner.os == 'macOS'
        timeout-minutes: 3
        run: python scripts/check_desktop.py

      - name: Settings panel interaction smoke (native Qt)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        timeout-minutes: 2
        run: python scripts/check_settings_panel.py

      - name: Settings scaling smoke (offscreen Qt)
        shell: bash
        run: |
          for scale in 1.5 2; do
            QT_QPA_PLATFORM=offscreen QT_SCALE_FACTOR=$scale python scripts/check_settings_panel.py || exit 1
          done
