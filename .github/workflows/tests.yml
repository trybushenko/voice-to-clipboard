name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Install platform speech backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "$(uname -m)" = "arm64" ]; then
            python -m pip install '.[mac,hotkeys]'
            python -c "import mlx_whisper"
          else
            python -m pip install '.[whisper,hotkeys]'
            python -c "import faster_whisper"
          fi
      - run: python -m unittest discover -s tests -v
      - run: voice-to-clipboard --help
      - run: python tests/unit/test_gate.py
