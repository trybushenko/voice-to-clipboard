name: macOS ARM64 DMG
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/**"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/requirements.txt '.[mac,whisper,hotkeys,desktop]'
      - run: bash packaging/macos/build.sh
      - run: python scripts/check_macos_dmg.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-dmg
          path: |
            artifacts/
            build/desktop/warn-desktop.txt
          retention-days: 14
