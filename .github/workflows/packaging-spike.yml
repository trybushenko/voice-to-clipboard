name: Packaging spike
on:
  workflow_dispatch:
  push:
    branches: [codex/packaging-spike]
permissions:
  contents: read
jobs:
  frozen:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install -r packaging/requirements.txt
          if [ "${{ runner.os }}" = "macOS" ]; then
            test "$(uname -m)" = arm64
            python -m pip install '.[mac,whisper,hotkeys,desktop]'
          else
            python -m pip install '.[whisper,hotkeys,desktop]'
          fi
          python -m pip freeze > packaging-dependencies.txt
      - run: python -m PyInstaller --clean --noconfirm packaging/desktop.spec
      - name: Frozen smoke and measurements
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            python scripts/check_frozen.py dist/VoiceToClipboard.app/Contents/MacOS/VoiceToClipboard
            python scripts/check_desktop.py --executable dist/VoiceToClipboard.app/Contents/MacOS/VoiceToClipboard
          else
            python scripts/check_frozen.py dist/VoiceToClipboard/VoiceToClipboard.exe
            python scripts/check_desktop.py --executable dist/VoiceToClipboard/VoiceToClipboard.exe
          fi
      - name: Archive bundle (preserve macOS symlinks)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf packaging-bundle.tar.gz -C dist VoiceToClipboard.app
          else
            tar -czf packaging-bundle.tar.gz -C dist VoiceToClipboard
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-${{ matrix.os }}
          path: |
            packaging-report.json
            packaging-dependencies.txt
            packaging-bundle.tar.gz
            build/desktop/warn-desktop.txt
          retention-days: 7
